
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cart | Glow</title>
    <link rel="stylesheet" href="css/Style.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <header class="navbar">
        <a href="index.html" class="logo">glow<span>.</span></a>

        <nav>
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
        </nav>

        <a href="cart.html" class="cart-link">
            Cart <span id="cart-count">0</span>
        </a>
    </header>

    <main class="cart-page">
        <span class="eyebrow">YOUR SELECTION</span>
        <h1>Shopping Cart</h1>

        <div class="cart-layout">
            <div id="cart-items">
                <p>Loading cart...</p>
            </div>

            <div class="cart-summary">
                <h2>Order Summary</h2>

                <div class="summary-line">
                    <span>Total</span>
                    <strong id="cart-total">0 EGP</strong>
                </div>

                <div class="checkout-form">
                    <h3>Customer Information</h3>

                    <form id="checkout-form">

                        <label for="customer-name">Full Name</label>
                        <input
                            type="text"
                            id="customer-name"
                            placeholder="Enter your name"
                            required
                        >
                            <br>
                        <label for="customer-phone">Phone Number</label>
                        <input
                            type="tel"
                            id="customer-phone"
                            placeholder="Enter your phone number"
                            required
                        >

                        <button type="submit" id="checkout-btn">
                            Confirm Order
                        </button>

                    </form>
                </div>

                <a href="products.html" class="continue-shopping">
                    Continue Shopping
                </a>
            </div>

        </div>
    </main>

    <footer>
        <a href="index.html" class="logo">glow<span>.</span></a>
        <p>Beauty is in the details.</p>
        <small>© 2026 Glow. All rights reserved.</small>
    </footer>

    <script src="js/Js.js"></script>
</body>
</html>
